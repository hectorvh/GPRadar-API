name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The golden test needs the real model. Set the repository variable
      # HF_REVISION to the pinned commit to run it; without it the API tests
      # use a tiny dummy ONNX model and the golden test is skipped.
      - name: Fetch model (optional)
        if: ${{ vars.HF_REVISION != '' }}
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_REVISION: ${{ vars.HF_REVISION }}
        run: |
          mkdir -p model
          python -c "import os, shutil; from huggingface_hub import hf_hub_download as d; shutil.copy(d('hectorvh/gpradar-hyperbola-yolo', 'best.onnx', revision=os.environ['HF_REVISION']), 'model/best.onnx')"
      - run: python -m pytest -v -rs   # -rs: show why golden tests were skipped
