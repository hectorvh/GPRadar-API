# Render blueprint (v1.1). Render builds the Dockerfile and passes environment
# variables to the build as build args, so HF_REVISION pins the model.
services:
  - type: web
    name: gpradar-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HF_REVISION
        sync: false # full 40-char commit of hectorvh/gpradar-hyperbola-yolo that contains best.onnx
      - key: ALLOWED_ORIGINS
        sync: false # https://gpradar.hectorvh.com,https://<site>.netlify.app
      - key: MAX_IMAGE_MB
        value: "10"
      - key: MAX_RAW_MB
        value: "25"
      - key: MAX_TRACES
        value: "4000"
      - key: MAX_SAMPLES
        value: "4096"
      - key: MAX_ARRAY_ELEMENTS
        value: "2000000"
      # 512 MB instance: a 25 MP JPEG peaked at about 393 MiB, so keep the 12 MP default.
      - key: MAX_PIXELS
        value: "12000000"
      - key: RUN_TIMEOUT_S
        value: "25"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "10"
      # Cloudflare sits in front of Render and sets CF-Connecting-IP to the real client.
      - key: CLIENT_IP_HEADER
        value: "cf-connecting-ip"
      - key: TRUSTED_PROXY_HOPS
        value: "1" # fallback only, when CF-Connecting-IP is absent or invalid
      - key: MIN_CONF
        value: "0.05"
      - key: LOG_LEVEL
        value: info
